spring:
  application:
    name: hemorede
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    url: jdbc:h2:mem:hemorede;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # histograma necessário para o p50/p95 agregado de /api/v1/metricas/rede (PI2-173)
      percentiles-histogram:
        http.server.requests: true

hemorede:
  seed:
    enabled: true
  doacao:
    intervalo-minimo-dias-homem: 60
    intervalo-minimo-dias-mulher: 90
  estoque:
    limite-minimo-padrao: 5
  rota:
    velocidade-media-kmh: 60
  indicadores:
    risco:
      # Lambdas diarios (bolsas/dia) do cenario sintetico - doc/est-u2-probabilidade.md, secao 3.2 (PI2-177)
      lambda-diario:
        O_POS: 1.44
        A_POS: 1.36
        O_NEG: 0.36
        A_NEG: 0.32
        B_POS: 0.32
        AB_POS: 0.10
        B_NEG: 0.08
        AB_NEG: 0.02
