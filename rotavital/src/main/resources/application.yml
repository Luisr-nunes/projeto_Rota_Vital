spring:
  application:
    name: hemorede
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    url: jdbc:h2:mem:hemorede;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # diferencia a aplicação nas consultas do Grafana (ex.: http_server_requests_seconds{application="hemorede"})
      application: ${spring.application.name}
    distribution:
      # baldes fixos de latência para o p50/p95 agregado de /api/v1/metricas/rede (PI2-173)
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}

info:
  app:
    name: ${spring.application.name}
    description: Rota Vital — gestão e distribuição de hemocomponentes

hemorede:
  seed:
    enabled: true
  # Autenticação dos 3 perfis. Sem valor padrão: vem só da variável de ambiente.
  jwt:
    secret: ${JWT_SECRET:}
  demo:
    senha: ${DEMO_SENHA:}
  doacao:
    intervalo-minimo-dias-homem: 60
    intervalo-minimo-dias-mulher: 90
  # Coordenadas sintéticas do hemocentro (nó N0 do grafo) para o mapa da entrega
  hemocentro:
    latitude: -8.0476
    longitude: -34.8990
  rastreamento:
    # 1 = tempo real; aumente na demonstração para ver o veículo andar mais rápido
    fator-tempo: ${RASTREAMENTO_FATOR_TEMPO:1}
  estoque:
    limite-minimo-padrao: 5
  rota:
    velocidade-media-kmh: 60
  indicadores:
    risco:
      # Lambdas diarios (bolsas/dia) do cenario sintetico - doc/est-u2-probabilidade.md, secao 3.2 (PI2-177)
      lambda-diario:
        O_POS: 1.44
        A_POS: 1.36
        O_NEG: 0.36
        A_NEG: 0.32
        B_POS: 0.32
        AB_POS: 0.10
        B_NEG: 0.08
        AB_NEG: 0.02
  simulador:
    # Desligado por padrão. Para ligar: --hemorede.simulador.enabled=true
    enabled: false
    cenario: baixo        # baixo | moderado | alto
    cenarios:
      baixo:    { veiculos: 10,  intervalo-ms: 5000 }
      moderado: { veiculos: 50,  intervalo-ms: 1000 }
      alto:     { veiculos: 100, intervalo-ms: 200 }
