<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha · Rota Vital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/rota-vital.css">
</head>
<body class="bg-auth">
  <header class="navbar">
    <a class="brand" href="login.html" data-drop></a>
    <nav class="navbar-links" aria-label="Institucional">
      <a href="index.html">Home</a>
      <a href="index.html#sobre">Quem somos</a>
      <a href="mailto:contato@rotavital.com">Entrar em contato</a>
    </nav>
  </header>

  <main class="auth-main">
    <!-- 0.4 · Recuperar senha -->
    <form class="auth-card glass" id="form" novalidate>
      <span class="icon-tile" data-lock></span>
      <div class="auth-head">
        <h1 class="auth-title">Recuperar senha</h1>
        <p class="auth-sub" style="opacity:1">Informe o e-mail cadastrado. Enviaremos um link para você criar uma nova senha.</p>
      </div>
      <div id="erro" hidden></div>
      <label class="field">
        <span class="field-label">E-mail</span>
        <span class="input lg glass-input" data-ic="mail"><input type="email" name="email" autocomplete="email" placeholder="voce@rotavital.com" required></span>
      </label>
      <button type="submit" class="btn btn-primary xl block">Enviar link de recuperação <span data-arrow></span></button>
      <a class="auth-foot link" href="login.html" style="gap:6px;align-items:center" data-back>Voltar para o login</a>
    </form>

    <!-- 0.5 · Link enviado -->
    <section class="auth-card glass center" id="enviado" hidden aria-live="polite">
      <span class="status-circle" data-ok></span>
      <h1 class="auth-title sm">Verifique seu e-mail</h1>
      <p class="auth-sub" style="opacity:1;max-width:340px">Enviamos um link para <b id="para"></b>. Ele expira em 30 minutos.</p>
      <a class="btn btn-primary xl block" href="login.html">Voltar para o login</a>
      <button type="button" class="btn btn-ghost" id="reenviar" disabled style="opacity:1;color:var(--text-2);font-weight:500;font-size:13px"></button>
    </section>
  </main>

  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const { ui } = RV;
    authChrome();
    document.querySelector('[data-lock]').innerHTML = ui.icon('lock', 24, '#2F5E55', 2);
    document.querySelector('[data-arrow]').outerHTML = ui.icon('arrowR', 18, '#fff', 2);
    document.querySelector('[data-back]').insertAdjacentHTML('afterbegin', ui.icon('arrowL', 16, '#2F5E55', 2));
    document.querySelector('[data-ok]').innerHTML = ui.icon('check', 30, '#fff', 2.6);

    const form = document.getElementById('form');
    const enviado = document.getElementById('enviado');
    const reenviar = document.getElementById('reenviar');
    let timer;

    // O backend ainda não tem envio de e-mail: a tela simula o envio e mostra a confirmação.
    function enviar(email) {
      document.getElementById('para').textContent = email;
      form.hidden = true; enviado.hidden = false;
      let s = 45;
      const paint = () => {
        reenviar.innerHTML = ui.icon('clock', 16, '#2E403C') + (s > 0 ? ` Reenviar link em 0:${RV.pad(s)}` : ' Reenviar link');
        reenviar.disabled = s > 0;
        reenviar.style.color = s > 0 ? 'var(--text-2)' : 'var(--teal-link)';
      };
      clearInterval(timer); paint();
      timer = setInterval(() => { s--; paint(); if (s <= 0) clearInterval(timer); }, 1000);
    }
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      if (markInvalid(form.email, !/^\S+@\S+\.\S+$/.test(email))) {
        const erro = document.getElementById('erro');
        erro.innerHTML = ui.alertBox('error', 'E-mail inválido', 'Confira o endereço digitado.');
        erro.hidden = false; return;
      }
      enviar(email);
    });
    reenviar.addEventListener('click', () => { enviar(document.getElementById('para').textContent); ui.toast('success', 'Link reenviado', 'Confira sua caixa de entrada e o spam.'); });
  </script>
</body>
</html>
