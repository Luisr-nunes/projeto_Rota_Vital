name: CI/CD - Rota Vital

# Gate do pipeline (PI2-223 / PI2-189):
# - pull_request para a main: roda build + testes; teste vermelho deixa o PR vermelho
#   e, com a proteção da main exigindo o check "build-and-test", o merge fica bloqueado.
# - push na main (merge aprovado): roda de novo e o Render publica a versão.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar projeto
        working-directory: ./rotavital
        run: mvn -B package -DskipTests

      - name: Executar testes (unitários, integração e BDD)
        working-directory: ./rotavital
        run: mvn -B test
