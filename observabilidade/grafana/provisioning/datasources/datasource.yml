apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # R6: navegação log -> trace. Extrai o traceId da linha de log (logback-spring.xml do
      # rotavital imprime "traceId=<id>") e linka pro datasource do Tempo abaixo.
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "traceId=(\\w+)"
          name: traceId
          url: "$${__value.raw}"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # R6: navegação trace -> logs, filtrando pela label application do Loki.
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        tags:
          - key: application
