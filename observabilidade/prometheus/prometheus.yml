global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # R1/R2: métricas de aplicação (HTTP, JVM, pool HikariCP) e de negócio (counter/timer/gauge).
  # A tag "application" já vem de dentro da aplicação (management.metrics.tags.application).
  - job_name: hemorede
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]

  # R3: infraestrutura do host (CPU, memória, disco, rede, load average).
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # R3: infraestrutura por contêiner (CPU e memória por serviço do Compose).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
