# Tempo de instância única, armazenamento local em disco. Lido pelo container "tempo" do
# docker-compose.yml. Recebe traces via OTLP (grpc 4317 / http 4318) direto da aplicação
# (management.otlp.tracing.endpoint no application.yml do rotavital).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal

# Sem métricas derivadas de trace (gerador de métricas) nesta entrega — fora do escopo do
# enunciado, que pede só a correlação log → trace via Grafana.
